        #play-button::before {

        #play-button:hover {

        @keyframes shine {

        }

        /* Efeito de pulsar quando o vídeo estiver pausado */

        @keyframes pulse {

            }

            100% {
                box-shadow: 0 0.25rem 1rem rgba(0, 0, 0, 0.3),
                    0 0 0 0 rgba(255, 255, 255, 0);
            }
        }

    <body>


        <div class="container">
            <!-- Seção de vídeo -->
            <div class="video-section">
                <div class="video-input">
                    <input type="text" id="video-url" placeholder="Cole o link do vídeo do YouTube aqui...">
                    <button onclick="loadVideo()">Assistir</button>
                </div>
                <div class="video-player" id="video-player">
                    <p style="color: #888; text-align: center; padding: 20px;">O vídeo será exibido aqui.</p>
                </div>

                <button id="play-button" onclick="togglePlay()"><i class="fa-solid fa-play"></i></button>


            </div>

            <!-- Seção de chat -->
            <div class="chat-section">
                <h2>Chat ao Vivo</h2>
                <div class="botoes-container">
                    <button class="botao-chat" onclick="openCreateVotePopup()">Criar Votação</button>
                    <button class="botao-chat" onclick="openRespondVotePopup()">Responder Votação</button>
                    <button class="botao-chat">Proximo</button>
                    <button class="botao-chat">Historico</button>
                </div>
                <div class="chat-box" id="chat-box"></div>
                <div class="chat-input">
                    <input type="text" id="chat-message" placeholder="Digite sua mensagem...">
                    <button id="menssage" onclick="sendMessage()">Enviar</button>
                </div>

            </div>
            <!-- Pop-Up de Criar Votação -->
            <div id="create-vote-popup-container" class="popup-hidden">
                <div class="popup-content">
                    <h2>Criar Votação</h2>
                    <textarea id="vote-options-input" placeholder="Insira as opções separadas por linhas"></textarea>
                    <input id="vote-timer" type="number" placeholder="Duração da votação (em segundos)">
                    <button onclick="createVote()">Criar</button>
                    <button onclick="closeCreateVotePopup()">Fechar</button>
                </div>
            </div>

            <!-- Pop-Up de Responder Votação -->
            <div id="respond-vote-popup-container" class="popup-hidden">
                <div class="popup-content">
                    <h2>Responder Votação</h2>
                    <div id="respond-vote-options"></div>
                    <button onclick="closeRespondVotePopup()">Fechar</button>
                </div>
            </div>

            <!-- Temporizador -->
            <div id="vote-timer-display" class="timer-display"></div>

            <!-- Resultados -->
            <div id="vote-results-display" class="results-display"></div>

        </div>
        <script>
            const videoDatabaseUrl = "https://cinema-online-1ee04-default-rtdb.firebaseio.com/video.json";
            const chatDatabaseUrl = "https://cinema-online-1ee04-default-rtdb.firebaseio.com/chat.json";
            const playbackStateUrl = "https://cinema-online-1ee04-default-rtdb.firebaseio.com/playbackState.json";
            let currentVideoId = null;
            let isPlaying = false;
            let videoIframe = null;


            const activeVoteUrl = "https://cinema-online-1ee04-default-rtdb.firebaseio.com/activeVote.json";
            let voteInterval = null;

            function openCreateVotePopup() {
                document.getElementById("create-vote-popup-container").style.display = "block";
            }

            function closeCreateVotePopup() {
                document.getElementById("create-vote-popup-container").style.display = "none";
            }

            function openRespondVotePopup() {
                fetch(activeVoteUrl)
                    .then(response => response.json())
                    .then(data => {
                        if (!data || !data.options) {
                            alert("Nenhuma votação ativa no momento.");
                            return;
                        }

                        const optionsContainer = document.getElementById("respond-vote-options");
                        optionsContainer.innerHTML = "";
                        data.options.forEach((option, index) => {
                            const button = document.createElement("button");
                            button.textContent = option;
                            button.onclick = () => vote(index);
                            optionsContainer.appendChild(button);
                        });

                        document.getElementById("respond-vote-popup-container").style.display = "block";
                    })
                    .catch(error => console.error("Erro ao carregar a votação:", error));
            }

            function closeRespondVotePopup() {
                document.getElementById("respond-vote-popup-container").style.display = "none";
            }

            function createVote() {
                const optionsInput = document.getElementById("vote-options-input").value.trim();
                const timerDuration = parseInt(document.getElementById("vote-timer").value, 10);

                if (!optionsInput || isNaN(timerDuration) || timerDuration < 10) {
                    alert("Por favor, preencha as opções e um tempo válido (mínimo 10 segundos).");
                    return;
                }

                const options = optionsInput.split("\n").map(opt => opt.trim()).filter(opt => opt);

                if (options.length < 2) {
                    alert("A votação deve ter pelo menos duas opções.");
                    return;
                }

                const voteData = {
                    options: options,
                    votes: Array(options.length).fill(0),
                    startTime: Date.now(),
                    timerDuration: timerDuration * 1000
                };

                fetch(activeVoteUrl, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(voteData)
                })
                    .then(response => {
                        if (!response.ok) throw new Error("Erro ao criar votação");
                        alert("Votação criada com sucesso!");
                        closeCreateVotePopup();
                        startVoteTimer(timerDuration);
                    })
                    .catch(error => {
                        console.error("Erro ao criar votação:", error);
                        alert("Houve um erro ao criar a votação. Tente novamente.");
                    });
            }

            function vote(index) {
                fetch(activeVoteUrl)
                    .then(response => response.json())
                    .then(data => {
                        if (!data || !data.votes) return;
                        data.votes[index] += 1;

                        fetch(activeVoteUrl, {
                            method: "PUT",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(data)
                        })
                            .then(() => alert("Voto registrado com sucesso!"))
                            .catch(error => console.error("Erro ao registrar voto:", error));
                    });
            }

            function startVoteTimer(duration) {
                const timerDisplay = document.getElementById("vote-timer-display");
                timerDisplay.style.display = "block";
                let timeLeft = duration;

                clearInterval(voteInterval);
                voteInterval = setInterval(() => {
                    if (timeLeft <= 0) {
                        clearInterval(voteInterval);
                        showVoteResults();
                        timerDisplay.style.display = "none";
                    } else {
                        timerDisplay.textContent = `Tempo restante: ${timeLeft} segundos`;
                        timeLeft -= 1;
                    }
                }, 1000);
            }

            function showVoteResults() {
                fetch(activeVoteUrl)
                    .then(response => response.json())
                    .then(data => {
                        if (!data || !data.votes) return;
                        const resultsDisplay = document.getElementById("vote-results-display");
                        resultsDisplay.style.display = "block";
                        resultsDisplay.innerHTML = "<h2>Resultados da Votação</h2>";
                        data.options.forEach((option, index) => {
                            resultsDisplay.innerHTML += `<p>${option}: ${data.votes[index]} votos</p>`;
                        });
                    })
                    .catch(error => console.error("Erro ao carregar resultados:", error));
            }



            // Carregar vídeo
            function loadVideo() {
                const url = document.getElementById('video-url').value;
                const videoId = url.split("v=")[1]?.split("&")[0];

                if (videoId) {
                    currentVideoId = videoId;
                    updateVideoPlayer();
                    saveVideoToFirebase(videoId);
                } else {
                    alert("Por favor, insira um link válido do YouTube.");
                }
            }

            function updateVideoPlayer() {
                const player = document.getElementById('video-player');
                player.innerHTML = `
        <iframe width="100%" height="100%" src="https://www.youtube.com/embed/${currentVideoId}?enablejsapi=1" 
        title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    `;
                videoIframe = player.querySelector('iframe');
                // Carregar o estado de reprodução
                loadPlaybackState();
            }

            function saveVideoToFirebase(videoId) {
                fetch(videoDatabaseUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ videoId: videoId })
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Erro ao salvar o vídeo');
                        }
                        console.log('Vídeo salvo com sucesso!');
                    })
                    .catch(error => {
                        console.error('Erro:', error);
                    });
            }

            // Play/Pause
            function togglePlay() {
                isPlaying = !isPlaying;
                const action = isPlaying ? 'play' : 'pause';
                fetch(playbackStateUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ isPlaying: isPlaying })
                });
                syncPlayback(action);
            }

            function syncPlayback(action) {
                if (action === 'play') {
                    videoIframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
                } else {
                    videoIframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
                }
            }

            // Carregar o estado de reprodução
            function loadPlaybackState() {
                fetch(playbackStateUrl)
                    .then(response => response.json())
                    .then(data => {
                        const latestState = Object.values(data).pop();
                        if (latestState && latestState.isPlaying) {
                            syncPlayback('play');
                            isPlaying = true;
                        } else {
                            syncPlayback('pause');
                            isPlaying = false;
                        }
                    })
                    .catch(error => {
                        console.error('Erro ao carregar estado de reprodução:', error);
                    });
            }

            // Enviar mensagem para o chat
            function sendMessage() {
                const message = document.getElementById('chat-message').value;
                if (message) {
                    const messageData = {
                        message: message,
                    };

                    // Enviar a mensagem para o Firebase usando a API REST
                    fetch(chatDatabaseUrl, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(messageData)
                    })
                        .then(response => {
                            if (!response.ok) {
                                throw new Error('Erro ao enviar a mensagem');
                            }
                            console.log('Mensagem enviada com sucesso!');
                            document.getElementById('chat-message').value = '';
                        })
                        .catch(error => {
                            console.error('Erro:', error);
                        });
                } else {
                    alert("Digite uma mensagem antes de enviar.");
                }
            }

            // Carregar mensagens do chat em tempo real
            function loadMessages() {
                fetch(chatDatabaseUrl)
                    .then(response => response.json())
                    .then(data => {
                        const chatBox = document.getElementById('chat-box');
                        chatBox.innerHTML = ''; // Limpa o chat existente
                        for (const key in data) {
                            const msgData = data[key];
                            const msgElement = document.createElement("div");
                            msgElement.classList.add("message");
                            msgElement.textContent = `${msgData.message}`;
                            chatBox.appendChild(msgElement);
                        }
                        chatBox.scrollTop = chatBox.scrollHeight; // Rolagem para a última mensagem
                    })
                    .catch(error => {
                        console.error('Erro ao carregar mensagens:', error);
                    });
            }

            // Carregar vídeos armazenados
            function loadStoredVideo() {
                fetch(videoDatabaseUrl)
                    .then(response => response.json())
                    .then(data => {
                        const videoKeys = Object.keys(data);
                        if (videoKeys.length > 0) {
                            const latestVideo = data[videoKeys[videoKeys.length - 1]];
                            currentVideoId = latestVideo.videoId;
                            updateVideoPlayer();
                        }
                    })
                    .catch(error => {
                        console.error('Erro ao carregar vídeos:', error);
                    });
            }

            // Variável global para armazenar o nickname
            let userNickname = '';

            // Modificar a função closePopup para capturar o nickname
            function closePopup() {
                // Seleciona o elemento do pop-up
                var popup = document.getElementById("popup-container");

                // Captura o nickname do input
                userNickname = document.querySelector('#popup-container input[type="text"]').value.trim();

                // Verifica se o nickname foi preenchido
                if (!userNickname) {
                    alert("Por favor, insira um nickname antes de continuar.");
                    return;
                }

                // Esconde o pop-up
                popup.style.display = 'none';
                popup.classList.remove('popup-visible');
            }

            // Modifica a função de enviar mensagem para incluir o nickname
            function sendMessage() {
                const message = document.getElementById('chat-message').value;
                if (message) {
                    const messageData = {
                        nickname: userNickname, // Adiciona o nickname à mensagem
                        message: message
                    };

                    // Enviar a mensagem para o Firebase usando a API REST
                    fetch(chatDatabaseUrl, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(messageData)
                    })
                        .then(response => {
                            if (!response.ok) {
                                throw new Error('Erro ao enviar a mensagem');
                            }
                            console.log('Mensagem enviada com sucesso!');
                            document.getElementById('chat-message').value = '';
                        })
                        .catch(error => {
                            console.error('Erro:', error);
                        });
                } else {
                    alert("Digite uma mensagem antes de enviar.");
                }
            }

            // Modifica a função de carregar mensagens para mostrar o nickname
            function loadMessages() {
                fetch(chatDatabaseUrl)
                    .then(response => response.json())
                    .then(data => {
                        const chatBox = document.getElementById('chat-box');
                        chatBox.innerHTML = ''; // Limpa o chat existente
                        for (const key in data) {
                            const msgData = data[key];
                            const msgElement = document.createElement("div");
                            msgElement.classList.add("message");
                            // Formato da mensagem agora inclui o nickname
                            msgElement.textContent = `${msgData.nickname}: ${msgData.message}`;
                            chatBox.appendChild(msgElement);
                        }
                        chatBox.scrollTop = chatBox.scrollHeight; // Rolagem para a última mensagem
                    })
                    .catch(error => {
                        console.error('Erro ao carregar mensagens:', error);
                    });
            }
            // Carregar mensagens a cada 2 segundos
            setInterval(loadMessages, 2000);
            window.onload = loadStoredVideo;
        </script>
    </body>

</html>
