<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>

         /* Estilo para o popup de compartilhamento */
         .share-popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .share-popup-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 300px;
        }

        .share-buttons button {
            margin-top: 10px;
            padding: 10px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .share-buttons button:hover {
            background-color: #45a049;
        }

        /* Estilos do layout da sala de cinema */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            font-family: "Helvetica", sans-serif;

            background-color: #181818;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        .container {
            display: flex;
            width: 90%;
            max-width: 1200px;
            background-color: #282828;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .video-section {
            flex: 3;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .chat-section {
            flex: 1;
            background-color: #333;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: "Helvetica", sans-serif;

        }

        .video-input {
            display: flex;
            margin-bottom: 15px;
            gap: 10px;
        }

        .video-input input[type="text"] {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #404040;
            color: #fff;
        }

        .video-input button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #ffcc00;
            color: #000;
            cursor: pointer;
            transition: background 0.3s;
        }

        .video-input button:hover {
            background-color: #000000;
        }

        .video-player {
            width: 100%;

            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-section h2 {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            margin-bottom: 10px;
        }

        .chat-box {
            width: 100%;
            height: 200px;
            background-color: #222;
            overflow-y: auto;
            border-radius: 5px;
            padding: 10px;
            color: #bbb;
        }

        .message {
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .chat-input {
            display: flex;
            gap: 5px;
            margin-top: 10px;
            width: 100%;
        }

        .chat-input input[type="text"] {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #404040;
            color: #fff;
        }


        /* Estilo do header e navbar */
        header {
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            /* Para garantir que fique acima dos outros elementos */
            box-shadow: 0 0.0625rem 0.3125rem rgba(0, 0, 0, 0.1);
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            /* Espaçamento entre logo, pesquisa e perfil */
            padding: 0.625rem 1.25rem;
            background-color: #333;
            /* Ajuste de cor conforme sua preferência */
            color: white;
        }

        /* Logo */
        .logo {
            display: flex;
            align-items: center;
        }

        .logo img {
            width: 4.5rem;
            /* Tamanho do logo */
            margin-right: 0.5rem;
        }

        .logo span {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            margin-left: 1.5rem;
        }

        /* Barra de pesquisa */
        /* Barra de pesquisa */
        .search-bar {
            flex-grow: 1;
            max-width: 60%;
            /* Define uma largura máxima */
            margin: 0 auto;
            /* Centraliza a barra de pesquisa */
            padding: 0.5rem;
            border: 0.0625rem solid #ccc;
            border-radius: 0.3125rem;
            font-size: 1rem;
            background-color: #333;
            /* Alterar para a cor desejada */
            color: #ffffff;
        }

        .botao-chat {
            background-color: #1a1a1a;
            color: #ffffff;
            border: 0.0925rem solid #2a2a2a;
            /* 1px */
            border-radius: 0.75rem;
            /* 12px */
            padding: 0.5rem 1rem;
            /* 8px 16px */
            font-size: 0.875rem;
            /* 14px */
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            transition: all 0.3s ease;
            box-shadow: 0 0.125rem 0.5rem rgba(0, 0, 0, 0.2);
            /* 2px 8px */
            text-transform: uppercase;
            letter-spacing: normal;
            position: relative;
            overflow: hidden;
        }

        /* Classe específica para o botão "A SEGUIR" */
        .botao-chat.no-spacing {
            letter-spacing: 0;
            white-space: nowrap;
            padding: 0.5rem 0.75rem;
            /* 8px 12px */
        }

        .botoes-container {
            display: flex;
            gap: 0.5rem;
            /* 8px */
            padding: 0.625rem;
            /* 10px */
        }

        .botao-chat:hover {
            background-color: #2c2c2c;
            transform: translateY(-0.125rem);
            /* -2px */
            box-shadow: 0 0.25rem 0.75rem rgba(0, 0, 0, 0.3);
            /* 4px 12px */
            border-color: #3a3a3a;
        }

        .botao-chat:active {
            transform: translateY(0);
            background-color: #151515;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.2);
            /* 2px 4px */
        }

        .botao-chat::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg,
                    transparent,
                    rgba(255, 255, 255, 0.05),
                    transparent);
            transition: 0.5s;
        }

        .botao-chat:hover::before {
            left: 100%;
        }

        /* Variação com borda brilhante */
        .botao-chat.highlight {
            border: 0.0625rem solid #404040;
            /* 1px */
            background: linear-gradient(145deg, #1a1a1a, #222222);
        }

        /* Estilo para botão desabilitado */
        .botao-chat:disabled {
            background-color: #0f0f0f;
            color: #666666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }




        /* Botão de convite */
        .invite-button {
            padding: 0.5rem 1rem;

            color: white;
            border: none;
            border-radius: 0.8rem;
            font-size: 1rem;
            cursor: pointer;
            width: 12rem;
        }

        .invite-button:hover {
            background-color: #365899;
        }

        /* Ícone de perfil */
        .profile-icon {
            margin-left: 0.5rem;
            /* Reduzido para aproximar o ícone do botão */
            width: 2.5rem;
            height: 2.5rem;
            background-color: #666;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-icon i {
            color: white;
            font-size: 1.25rem;
        }

        #play-button {

            background: linear-gradient(145deg, #1a1a1a, #2a2a2a);
            color: #ffffff;
            border: 0.0625rem solid #333333;
            border-radius: 2rem;
            padding: 0.75rem 0rem;
            width: 15%;
            margin-left: 43%;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.125rem;
            box-shadow: 0 0.25rem 1rem rgba(0, 0, 0, 0.3),
                inset 0 0.125rem 0.25rem rgba(255, 255, 255, 0.1);
        }

        #play-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg,
                    transparent,
                    rgba(255, 255, 255, 0.1),
                    transparent);
            animation: shine 2s infinite;
        }

        #play-button:hover {
            transform: translateY(-0.125rem);
            background: linear-gradient(145deg, #2a2a2a, #333333);
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.4),
                inset 0 0.125rem 0.25rem rgba(255, 255, 255, 0.15);
        }

        #play-button:active {
            transform: translateY(0.0625rem);
            box-shadow: 0 0.125rem 0.5rem rgba(0, 0, 0, 0.2);
            background: linear-gradient(145deg, #222222, #2a2a2a);
        }

        @keyframes shine {
            0% {
                left: -100%;
            }

            20% {
                left: 100%;
            }

            100% {
                left: 100%;
            }
        }

        /* Efeito de pulsar quando o vídeo estiver pausado */
        #play-button.paused {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0.25rem 1rem rgba(0, 0, 0, 0.3),
                    0 0 0 0 rgba(255, 255, 255, 0.1);
            }

            70% {
                box-shadow: 0 0.25rem 1rem rgba(0, 0, 0, 0.3),
                    0 0 0 1rem rgba(255, 255, 255, 0);
            }

            100% {
                box-shadow: 0 0.25rem 1rem rgba(0, 0, 0, 0.3),
                    0 0 0 0 rgba(255, 255, 255, 0);
            }
        }

            <input type="text" id="nickname-input" placeholder="Seu nickname">

    <body>


        <div class="container">
            <!-- Seção de vídeo -->
            <div class="video-section">
                <div class="video-input">
                    <input type="text" id="video-url" placeholder="Cole o link do vídeo do YouTube aqui...">
                    <button onclick="loadVideo()">Assistir</button>
                </div>
                <div class="video-player" id="video-player">
                    <p style="color: #888; text-align: center; padding: 20px;">O vídeo será exibido aqui.</p>
                </div>

                <button id="play-button" onclick="togglePlay()"><i class="fa-solid fa-play"></i></button>


            </div>

            <!-- Seção de chat -->
            <div class="chat-section">
                <h2>Chat ao Vivo</h2>
                <div class="botoes-container">
                    <button class="botao-chat" onclick="showVotePopup()">Votação</button>
                    <button class="botao-chat">Proximo</button>
                    <button class="botao-chat">Historico</button>
                </div>
                <div class="chat-box" id="chat-box"></div>
                <div class="chat-input">
                    <input type="text" id="chat-message" placeholder="Digite sua mensagem...">
                    <button id="menssage" onclick="sendMessage()">Enviar</button>
                </div>

            </div>
            <!-- Pop-up de votação -->
            <div id="vote-popup-container" class="popup-hidden">
                <div class="popup-content">
                    <h2>Votação</h2>
                    <p>Escolha uma opção:</p>
                    <div id="vote-options">
                        <!-- As opções serão adicionadas dinamicamente -->
                    </div>
                    <button onclick="closeVotePopup()">Fechar</button>
                </div>
            </div>
        </div>
        <script>
            const videoDatabaseUrl = "https://cinema-online-1ee04-default-rtdb.firebaseio.com/video.json";
            const chatDatabaseUrl = "https://cinema-online-1ee04-default-rtdb.firebaseio.com/chat.json";
            const playbackStateUrl = "https://cinema-online-1ee04-default-rtdb.firebaseio.com/playbackState.json";
            let currentVideoId = null;
            let isPlaying = false;
            let videoIframe = null;


            const voteDatabaseUrl = "https://cinema-online-1ee04-default-rtdb.firebaseio.com/votes.json";

            function openSharePopup() {
                // Obtém o link atual da página
                const currentLink = window.location.href;

                // Preenche o input com o link
                document.getElementById('share-link').value = currentLink;

                // Mostra o popup de compartilhamento
                const sharePopup = document.getElementById('share-popup');
                sharePopup.style.display = 'flex';
            }

            function copyLink() {
                // Seleciona o campo de input
                const linkInput = document.getElementById('share-link');

                // Seleciona o texto do input
                linkInput.select();
                linkInput.setSelectionRange(0, 99999); // Para dispositivos móveis

                // Copia o texto para a área de transferência
                document.execCommand('copy');

                // Opcional: Mostra um alerta de sucesso
                alert('Link copiado com sucesso!');
            }

            function closeSharePopup() {
                // Fecha o popup de compartilhamento
                const sharePopup = document.getElementById('share-popup');
                sharePopup.style.display = 'none';
            }

            // Exibir pop-up de votação
            function showVotePopup() {
                const popup = document.getElementById("vote-popup-container");
                popup.style.display = 'block';
                popup.classList.remove('popup-hidden');
                loadVoteOptions();
            }

            // Fechar pop-up de votação
            function closeVotePopup() {
                const popup = document.getElementById("vote-popup-container");
                popup.style.display = 'none';
                popup.classList.add('popup-hidden');
            }

            // Carregar opções de votação
            function loadVoteOptions() {
                const options = ["Opção 1", "Opção 2", "Opção 3"]; // Personalize conforme necessário
                const voteOptionsContainer = document.getElementById("vote-options");
                voteOptionsContainer.innerHTML = '';

                options.forEach(option => {
                    const button = document.createElement("button");
                    button.textContent = option;
                    button.onclick = () => submitVote(option);
                    voteOptionsContainer.appendChild(button);
                });
            }

            // Enviar voto para o Firebase
            function submitVote(option) {
                fetch(voteDatabaseUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ option, voter: userNickname }) // Inclui o nickname do usuário
                })
                    .then(response => {
                        if (!response.ok) throw new Error("Erro ao enviar o voto");
                        alert(`Seu voto em "${option}" foi enviado!`);
                        closeVotePopup();
                    })
                    .catch(error => {
                        console.error("Erro:", error);
                    });
            }

            // Carregar resultados da votação em tempo real
            function loadVoteResults() {
                fetch(voteDatabaseUrl)
                    .then(response => response.json())
                    .then(data => {
                        const results = {};
                        for (const key in data) {
                            const vote = data[key];
                            results[vote.option] = (results[vote.option] || 0) + 1;
                        }

                        console.log("Resultados da votação:", results);
                        // Você pode exibir os resultados no pop-up ou em outro lugar
                    })
                    .catch(error => {
                        console.error("Erro ao carregar resultados da votação:", error);
                    });
            }

            // Atualizar resultados a cada 5 segundos
            setInterval(loadVoteResults, 5000);


            // Carregar vídeo
            function loadVideo() {
                const url = document.getElementById('video-url').value;
                const videoId = url.split("v=")[1]?.split("&")[0];

                if (videoId) {
                    currentVideoId = videoId;
                    updateVideoPlayer();
                    saveVideoToFirebase(videoId);
                } else {
                    alert("Por favor, insira um link válido do YouTube.");
                }
            }

            function updateVideoPlayer() {
                const player = document.getElementById('video-player');
                player.innerHTML = `
        <iframe width="100%" height="100%" src="https://www.youtube.com/embed/${currentVideoId}?enablejsapi=1" 
        title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    `;
                videoIframe = player.querySelector('iframe');
                // Carregar o estado de reprodução
                loadPlaybackState();
            }

            function saveVideoToFirebase(videoId) {
                fetch(videoDatabaseUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ videoId: videoId })
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Erro ao salvar o vídeo');
                        }
                        console.log('Vídeo salvo com sucesso!');
                    })
                    .catch(error => {
                        console.error('Erro:', error);
                    });
            }

            // Play/Pause
            function togglePlay() {
                isPlaying = !isPlaying;
                const action = isPlaying ? 'play' : 'pause';
                fetch(playbackStateUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ isPlaying: isPlaying })
                });
                syncPlayback(action);
            }

            function syncPlayback(action) {
                if (action === 'play') {
                    videoIframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
                } else {
                    videoIframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
                }
            }

            // Carregar o estado de reprodução
            function loadPlaybackState() {
                fetch(playbackStateUrl)
                    .then(response => response.json())
                    .then(data => {
                        const latestState = Object.values(data).pop();
                        if (latestState && latestState.isPlaying) {
                            syncPlayback('play');
                            isPlaying = true;
                        } else {
                            syncPlayback('pause');
                            isPlaying = false;
                        }
                    })
                    .catch(error => {
                        console.error('Erro ao carregar estado de reprodução:', error);
                    });
            }

            // Enviar mensagem para o chat
            function sendMessage() {
                const message = document.getElementById('chat-message').value;
                if (message) {
                    const messageData = {
                        message: message,
                    };

                    // Enviar a mensagem para o Firebase usando a API REST
                    fetch(chatDatabaseUrl, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(messageData)
                    })
                        .then(response => {
                            if (!response.ok) {
                                throw new Error('Erro ao enviar a mensagem');
                            }
                            console.log('Mensagem enviada com sucesso!');
                            document.getElementById('chat-message').value = '';
                        })
                        .catch(error => {
                            console.error('Erro:', error);
                        });
                } else {
                    alert("Digite uma mensagem antes de enviar.");
                }
            }

            // Carregar mensagens do chat em tempo real
            function loadMessages() {
                fetch(chatDatabaseUrl)
                    .then(response => response.json())
                    .then(data => {
                        const chatBox = document.getElementById('chat-box');
                        chatBox.innerHTML = ''; // Limpa o chat existente
                        for (const key in data) {
                            const msgData = data[key];
                            const msgElement = document.createElement("div");
                            msgElement.classList.add("message");
                            msgElement.textContent = `${msgData.message}`;
                            chatBox.appendChild(msgElement);
                        }
                        chatBox.scrollTop = chatBox.scrollHeight; // Rolagem para a última mensagem
                    })
                    .catch(error => {
                        console.error('Erro ao carregar mensagens:', error);
                    });
            }

            // Carregar vídeos armazenados
            function loadStoredVideo() {
                fetch(videoDatabaseUrl)
                    .then(response => response.json())
                    .then(data => {
                        const videoKeys = Object.keys(data);
                        if (videoKeys.length > 0) {
                            const latestVideo = data[videoKeys[videoKeys.length - 1]];
                            currentVideoId = latestVideo.videoId;
                            updateVideoPlayer();
                        }
                    })
                    .catch(error => {
                        console.error('Erro ao carregar vídeos:', error);
                    });
            }

            // Variável global para armazenar o nickname
            let userNickname = '';

            // Modificar a função closePopup para capturar o nickname
            function closePopup() {
                // Seleciona o elemento do pop-up
                var popup = document.getElementById("popup-container");

                // Captura o nickname do input
                userNickname = document.querySelector('#popup-container input[type="text"]').value.trim();

                // Verifica se o nickname foi preenchido
                if (!userNickname) {
                    alert("Por favor, insira um nickname antes de continuar.");
                    return;
                }

                // Esconde o pop-up
                popup.style.display = 'none';
                popup.classList.remove('popup-visible');
            }

            // Modifica a função de enviar mensagem para incluir o nickname
            function sendMessage() {
                const message = document.getElementById('chat-message').value;
                if (message) {
                    const messageData = {
                        nickname: userNickname, // Adiciona o nickname à mensagem
                        message: message
                    };

                    // Enviar a mensagem para o Firebase usando a API REST
                    fetch(chatDatabaseUrl, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(messageData)
                    })
                        .then(response => {
                            if (!response.ok) {
                                throw new Error('Erro ao enviar a mensagem');
                            }
                            console.log('Mensagem enviada com sucesso!');
                            document.getElementById('chat-message').value = '';
                        })
                        .catch(error => {
                            console.error('Erro:', error);
                        });
                } else {
                    alert("Digite uma mensagem antes de enviar.");
                }
            }

            // Modifica a função de carregar mensagens para mostrar o nickname
            function loadMessages() {
                fetch(chatDatabaseUrl)
                    .then(response => response.json())
                    .then(data => {
                        const chatBox = document.getElementById('chat-box');
                        chatBox.innerHTML = ''; // Limpa o chat existente
                        for (const key in data) {
                            const msgData = data[key];
                            const msgElement = document.createElement("div");
                            msgElement.classList.add("message");
                            // Formato da mensagem agora inclui o nickname
                            msgElement.textContent = `${msgData.nickname}: ${msgData.message}`;
                            chatBox.appendChild(msgElement);
                        }
                        chatBox.scrollTop = chatBox.scrollHeight; // Rolagem para a última mensagem
                    })
                    .catch(error => {
                        console.error('Erro ao carregar mensagens:', error);
                    });
            }
            // Carregar mensagens a cada 2 segundos
            setInterval(loadMessages, 2000);
            window.onload = loadStoredVideo;
        </script>
    </body>

</html>
